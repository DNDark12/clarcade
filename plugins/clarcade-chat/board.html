<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarcade</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  body { margin: 0; color: var(--color-text-primary, CanvasText); }
  main { margin: auto; max-width: 420px; padding: 12px 16px 16px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { font-size: 19px; margin: 0; }
  form { display: grid; gap: 10px; margin-top: 14px; }
  label { display: grid; gap: 4px; }
  button, input, select { font: inherit; }
  input:not([type="checkbox"]), select, .action { border: 1px solid var(--color-border-primary, GrayText); padding: 6px 8px; border-radius: 5px; }
  input, select { min-width: 0; }
  .checkbox { display: flex; align-items: center; gap: 6px; }
  button[aria-pressed="true"] { border-color: currentColor; font-weight: 700; }
  #invitation { display: grid; gap: 8px; }
  #invite-room, #copy-status, #share-pin { margin: 0; }
  #invite-room { font-weight: 600; overflow-wrap: anywhere; }
  .action { cursor: pointer; }
  .action:disabled { cursor: default; }
  #score { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  #status { min-height: 1.35em; margin: 8px 0; }
  #error { color: var(--color-text-danger, #c94532); margin: 8px 0 0; }
  #board { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 2px; }
  .cell { min-width: 0; aspect-ratio: 1; padding: 0; border: 1px solid transparent; border-radius: 2px;
    color: inherit; background: color-mix(in srgb, CanvasText 12%, Canvas); line-height: 1; font-weight: 700; }
  .cell[data-mark="X"] { color: light-dark(#943818, #f58a5b); }
  .cell[data-mark="O"] { color: light-dark(#2458a4, #9cc4ff); }
  .cell.latest { background: color-mix(in srgb, CanvasText 26%, Canvas); }
  .cell.win { border-color: light-dark(#307e51, #85dba3); }
  .cell:not(:disabled) { cursor: pointer; }
  .cell:not(:disabled):hover, .cell:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }
  .cell:disabled { opacity: 1; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  #offer-note { margin: 8px 0 0; font-weight: 600; }
  #rematch-note { margin: 8px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header><h1>Clarcade</h1><button id="expand" type="button" class="action" data-i18n="expand" hidden>Expand</button></header>
  <div class="actions" id="lobby-actions">
    <button id="show-join" class="action" type="button" data-i18n="joinRoom" aria-pressed="true">Join room</button>
    <button id="show-host" class="action" type="button" data-i18n="createRoom" aria-pressed="false">Create room</button>
  </div>
  <form id="join">
    <label><span data-i18n="link">LAN invitation link</span> <input name="link" placeholder="clarcade://j/…" required maxlength="256" autocomplete="off"></label>
    <label><span data-i18n="name">Your name</span> <input name="name" required maxlength="48" autocomplete="nickname"></label>
    <label><span data-i18n="pin">Private room PIN</span> <input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="off"></label>
    <button class="action" type="submit" data-i18n="join" disabled>Join</button>
  </form>
  <form id="host" hidden>
    <label><span data-i18n="name">Your name</span> <input name="name" required maxlength="48" autocomplete="nickname"></label>
    <label><span data-i18n="roomName">Room name</span> <input name="roomName" required maxlength="48"></label>
    <label class="checkbox"><input name="privateRoom" type="checkbox"> <span data-i18n="privateRoom">Private room</span></label>
    <label id="host-pin" hidden><span data-i18n="pin">Private room PIN</span> <input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="off" disabled></label>
    <button class="action" type="submit" data-i18n="createRoom" disabled>Create room</button>
  </form>
  <section id="invitation" hidden>
    <p id="invite-room"></p>
    <label><span data-i18n="linkAddress">Link address</span> <select id="invite-address"></select></label>
    <label><span data-i18n="link">LAN invitation link</span> <input id="invite-link" readonly></label>
    <button id="copy-link" type="button" class="action" data-i18n="copyLink">Copy link</button>
    <p id="copy-status" role="status" hidden></p>
    <p id="share-pin" data-i18n="sharePin" hidden>Share the PIN separately.</p>
  </section>
  <section id="game" hidden>
    <p id="score"></p>
    <div id="board" data-i18n-label="boardLabel" aria-label="Caro board"></div>
    <p id="offer-note" hidden></p>
    <div id="offer-actions" class="actions" hidden>
      <button id="offer-accept" type="button" class="action" data-i18n="accept">Accept</button>
      <button id="offer-decline" type="button" class="action" data-i18n="decline">Decline</button>
    </div>
    <div id="play-actions" class="actions" hidden>
      <button id="undo" type="button" class="action" data-i18n="requestUndo">Request undo</button>
      <button id="draw" type="button" class="action" data-i18n="requestDraw">Offer a draw</button>
      <button id="resign" type="button" class="action" data-i18n="resign">Resign</button>
    </div>
    <p id="rematch-note" hidden></p>
  </section>
  <div id="room-actions" class="actions" hidden>
    <button id="rematch" type="button" class="action" data-i18n="rematch" hidden>Play again</button>
    <button id="leave" type="button" class="action" data-i18n="leave">Leave</button>
  </div>
  <p id="status" role="status">Connecting to Claude Desktop…</p>
  <p id="error" role="alert" hidden></p>
</main>
<script>

    waiting: 'Đang chờ đối thủ…', cancelRoom: 'Hủy phòng', linkAddress: 'Địa chỉ trong link',
    shortLink: 'Link ngắn (dò qua LAN)', copyLink: 'Copy link', copied: 'Đã copy link.',
    copyManually: 'Đã chọn link. Nhấn Command+C để sao chép.', sharePin: 'Gửi PIN riêng cho đối thủ.',
    leave: 'Rời phòng', rematch: 'Chơi lại', rematchWaiting: 'Đang chờ đối thủ đồng ý chơi lại…',
    rematchOffered: 'Đối thủ muốn chơi lại.', boardLabel: 'Bàn Caro',
    requestUndo: 'Xin đi lại', requestDraw: 'Xin hòa', resign: 'Đầu hàng', accept: 'Đồng ý', decline: 'Từ chối',
    pendingUndo: 'Đang chờ đối thủ trả lời yêu cầu đi lại…', pendingDraw: 'Đang chờ đối thủ trả lời lời xin hòa…',
    offeredUndo: 'Đối thủ xin đi lại nước cuối.', offeredDraw: 'Đối thủ xin hòa.',

    reasons: { line: 'năm quân liên tiếp', resign: 'đầu hàng', disconnected: 'mất kết nối', 'board-full': 'bàn đã đầy',
      timeout: 'hết giờ', 'move-limit': 'đạt giới hạn số nước', 'draw-agreed': 'hai bên đồng ý hòa' }, connecting: 'Đang kết nối Claude Desktop…',
    pasteLink: 'Dán link LAN từ người tạo phòng.',

      score?.draws && `${score.draws} hòa`, `Bạn cầm ${mark}`].filter(Boolean).join(' · '),
    draw: 'Hòa', youWon: 'Bạn thắng', opponentWon: 'Đối thủ thắng', reconnecting: 'Đang kết nối lại…',

      'move-unavailable': 'Chưa thể đánh nước này.',
      'daemon-unavailable': 'Không kết nối được tiến trình Clarcade trên máy.',
      'node-required': 'Cần cài Node.js 22 trở lên trên máy để kết nối phòng LAN.',
      'view-timeout': 'Claude Desktop chưa trả lời giao diện Clarcade.',
      'rematch-unavailable': 'Chỉ chơi lại được khi ván đã kết thúc và hai bên đều đang kết nối.',
      'stale-game': 'Ván này đã thay đổi.',
      'offer-active': 'Đang có một yêu cầu chờ trả lời.',
      'undo-last-move': 'Bạn chỉ xin đi lại được nước cuối của chính mình.',
      'invalid-offer': 'Yêu cầu đó đã hết hiệu lực.',
      'action-unavailable': 'Chỉ làm được khi đang trong ván và hai bên đều kết nối.',
      'invalid-action': 'Thao tác này hiện không dùng được.',
      finished: 'Ván đã kết thúc.',
    },
  },
};
const languageOf = locale => /^vi(?:$|[-_])/i.test(String(locale ?? '')) ? 'vi' : 'en';
let language = languageOf(navigator.language);
let lastError = null;
const t = () => words[language];
function setLanguage(locale) {
  const next = languageOf(locale);
  if (next === language && document.documentElement.lang === next) return;
  language = next;
  document.documentElement.lang = next;
  for (const element of document.querySelectorAll('[data-i18n]')) element.textContent = t()[element.dataset.i18n];
  for (const element of document.querySelectorAll('[data-i18n-label]')) {
    element.setAttribute('aria-label', t()[element.dataset.i18nLabel]);

function send(message) { window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*'); }
function request(method, params) {

function showError(error) {

  get('error').hidden = !error;
}
async function tool(name, args = {}) {
  const result = await request('tools/call', { name, arguments: args });
  let data = result.structuredContent;
  if (!data) {
    try { data = JSON.parse(result.content?.[0]?.text); } catch {}
  }

}
function apply(data) {

    copyStatus = null;

  room = data.room;
  version = data.version;

}
function renderCopyStatus() {
  get('copy-status').hidden = !copyStatus;

}
function renderInvitation() {
  const direct = room.directLinks ?? [];
  const chosen = inviteAddress === '' ? undefined : direct.find(item => item.address === inviteAddress) ?? direct[0];
  addressField.replaceChildren(...direct.map(item => new Option(item.address, item.address)), new Option(t().shortLink, ''));
  addressField.parentElement.hidden = !direct.length;
  addressField.value = chosen?.address ?? '';
  linkField.value = chosen?.link ?? room.link;

  get('share-pin').hidden = room.visibility !== 'private';

}
function render() {
  const waiting = room?.role === 'host' && room.status === 'waiting';
  get('lobby-actions').hidden = Boolean(room);
  get('invitation').hidden = !waiting;
  get('game').hidden = !room || waiting;
  get('room-actions').hidden = !room;
  for (const [mode, form] of [['join', joinForm], ['host', hostForm]]) {
    form.hidden = Boolean(room) || lobby !== mode;
    form.querySelector('button').disabled = !ready || busy;
    const tab = get('show-' + mode);
    tab.setAttribute('aria-pressed', String(lobby === mode));
    tab.disabled = busy;

  leave.textContent = waiting ? t().cancelRoom : t().leave;
  rematch.hidden = true;
  rematch.disabled = busy;
  for (const button of [undo, draw, resign, get('offer-accept'), get('offer-decline')]) button.disabled = busy;
  if (!ready) return;
  if (!room) {
    get('status').textContent = lobby === 'join' ? t().pasteLink : '';
    return;
  }
  if (waiting) {
    renderInvitation();
    get('status').textContent = t().waiting;
    return;
  }
  const size = room.boardSize;
  if (size !== 15) {
    board.replaceChildren();
    renderedGame = undefined;
    get('status').textContent = t().unsupportedSize;
    return;
  }
  const edge = (size - 1) / 2;
  if (renderedGame !== room.gameId) {
    renderedGame = room.gameId;
    board.replaceChildren(...Array.from({ length: size * size }, (_, index) => {
      const cell = document.createElement('button');
      cell.type = 'button'; cell.className = 'cell';
      const x = index % size - edge, y = Math.floor(index / size) - edge;
      cell.addEventListener('click', () => {
        if (room && !busy) void action('play_move', { gameId: room.gameId, moveNo: room.boardVersion + 1,

      return cell;
    }));

  const cells = new Map(room.moves.map(({ x, y, mark }) => [`${x},${y}`, mark]));
  const won = new Set(room.winLine?.map(({ x, y }) => `${x},${y}`));
  const last = room.moves.at(-1);

    const cell = board.children[index], x = index % size - edge, y = Math.floor(index / size) - edge;

  get('score').textContent = t().score(room.roomName, room.hostName, room.guestName, room.mark, score);
  const text = t();
  const over = Boolean(room.finished)
  rematch.hidden = !over || room.rematchVoted || room.connection !== 'connected';
  get('rematch-note').hidden = !over || !(room.rematchVoted || room.rematchOffered);
  get('rematch-note').textContent = room.rematchVoted ? text.rematchWaiting : room.rematchOffered ? text.rematchOffered : '';

  const live = room.status === 'playing' && room.connection === 'connected';
  const offer = live ? room.offer : null;
  get('play-actions').hidden = !live || Boolean(offer);
  undo.hidden = last?.mark !== room.mark;
  get('offer-note').hidden = !offer;
  get('offer-note').textContent = !offer ? '' : offer.mine ? (offer.kind === 'undo' ? text.pendingUndo : text.pendingDraw)
    : offer.kind === 'undo' ? text.offeredUndo : text.offeredDraw;
  get('offer-actions').hidden = !offer || offer.mine;
  const secondsLeft = room.turnMs > 0 && room.turnEndsAt ? Math.max(0, Math.ceil((room.turnEndsAt - Date.now()) / 1000)) : null;
  const reason = room.reason && text.reasons[room.reason];
  get('status').textContent = room.finished
    ? [room.finished.draw ? text.draw : room.won ? text.youWon : text.opponentWon, reason].filter(Boolean).join(' · ')
    : [room.connection !== 'connected' ? text.reconnecting
      : busy || room.pendingMove ? text.confirming
        : room.turn === room.mark ? text.yourTurn : text.theirTurn,
      live && secondsLeft !== null && text.secondsLeft(secondsLeft),
      room.moveLimit > 0 && text.moveCount(room.boardVersion, room.moveLimit)].filter(Boolean).join(' · ');
}
function schedule() {
  clearTimeout(timer);
  if (!stopped && room) timer = setTimeout(() => void poll(), 1000);
}
async function poll() {
  if (stopped || busy || polling) { schedule(); return; }
  polling = true;
  const revision = actionRevision;
  try {
    const data = await tool('get_state', version ? { version } : {});
    if (!stopped && revision === actionRevision) apply(data);
    // A running clock counts down between state changes.
    if (!stopped && room?.turnEndsAt) render();
  } catch (error) { if (!stopped && revision === actionRevision) showError(error); }
  finally { polling = false; schedule(); }
}
async function action(name, args) {
  if (!ready || busy || stopped) return;
  actionRevision++;
  busy = true;
  showError(null);
  render();
  try { apply(await tool(name, args)); return true; }
  catch (error) { showError(error); }
  finally { busy = false; render(); schedule(); }
}
for (const mode of ['join', 'host']) {
  get('show-' + mode).addEventListener('click', () => {
    const current = lobby === 'join' ? joinForm : hostForm;
    const next = mode === 'join' ? joinForm : hostForm;
    if (!next.elements.name.value) next.elements.name.value = current.elements.name.value;
    lobby = mode;
    showError(null);
    render();
  });
}
hostForm.elements.privateRoom.addEventListener('change', () => {
  const privateRoom = hostForm.elements.privateRoom.checked;
  hostPin.required = privateRoom;
  hostPin.disabled = !privateRoom;
  get('host-pin').hidden = !privateRoom;
  if (!privateRoom) hostPin.value = '';
});
hostForm.addEventListener('submit', async event => {
  event.preventDefault();
  const values = new FormData(hostForm);
  const visibility = values.has('privateRoom') ? 'private' : 'public';
  if (await action('host_room', { name: String(values.get('name')).trim(), roomName: String(values.get('roomName')).trim(),
    visibility, ...(visibility === 'private' && { pin: values.get('pin') }) })) hostPin.value = '';
});
addressField.addEventListener('change', () => {
  inviteAddress = addressField.value;
  copyStatus = null;
  renderInvitation();
});
get('copy-link').addEventListener('click', async () => {
  const link = linkField.value;
  let status = 'copied';
  try { await navigator.clipboard.writeText(link); }
  catch { status = 'copyManually'; }
  if (room?.status !== 'waiting' || link !== linkField.value) return;
  if (status === 'copyManually') { linkField.focus(); linkField.select(); }
  copyStatus = status;
  renderCopyStatus();
});
joinForm.addEventListener('submit', async event => {
  event.preventDefault();
  const values = new FormData(joinForm);
  const pin = values.get('pin');
  if (await action('join_room', { link: String(values.get('link')).trim(), name: String(values.get('name')).trim(),
    ...(pin && { pin }) })) joinForm.elements.pin.value = '';
});
const gameAction = (name, extra = {}) => { if (room) void action('game_action', { gameId: room.gameId, action: name, ...extra }); };
undo.addEventListener('click', () => gameAction('undoReq'));
draw.addEventListener('click', () => gameAction('drawReq'));
resign.addEventListener('click', () => { if (window.confirm(t().resignConfirm)) gameAction('resign'); });
get('offer-accept').addEventListener('click', () => {
  if (room?.offer) gameAction(`${room.offer.kind}Resp`, { offerId: room.offer.id, accepted: true });
});
get('offer-decline').addEventListener('click', () => {
  if (room?.offer) gameAction(`${room.offer.kind}Resp`, { offerId: room.offer.id, accepted: false });
});
rematch.addEventListener('click', () => {
  if (room?.finished) void action('rematch', { gameId: room.gameId });
});
leave.addEventListener('click', () => {
  if (!room) return;
  if (room.status === 'playing' && !window.confirm(t().leaveConfirm)) return;
  void action('leave_room', { gameId: room.gameId });
});
function setHost(context) {
  if (context?.locale) setLanguage(context.locale);
  const theme = context?.theme;
  if (theme === 'dark' || theme === 'light') document.documentElement.style.colorScheme = theme;
  get('expand').hidden = !context?.availableDisplayModes?.includes('fullscreen') || context.displayMode === 'fullscreen';
}
get('expand').addEventListener('click', () => {
  void request('ui/request-display-mode', { mode: 'fullscreen' }).catch(showError);
});
window.addEventListener('message', event => {
  if (event.source !== window.parent) return;
  const message = event.data;
  if (message?.jsonrpc !== '2.0') return;
  if (message.method === 'ping') send({ id: message.id, result: {} });
  if (message.method === 'ui/notifications/host-context-changed') setHost(message.params);
  if (message.method === 'ui/resource-teardown') {
    stopped = true; clearTimeout(timer);
    send({ id: message.id, result: {} });
  }
  if (message.method || !requests.has(message.id)) return;
  const pending = requests.get(message.id);
  requests.delete(message.id);
  clearTimeout(pending.timeout);
  if (message.error) pending.reject(new Error(message.error.message));
  else pending.resolve(message.result);
});
async function start() {
  const result = await request('ui/initialize', {
    protocolVersion: '2026-01-26', appInfo: { name: 'Clarcade', version: '__CLARCADE_CHAT_VERSION__' },
    appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
  });
  if (!result?.protocolVersion) throw new Error('daemon-unavailable');
  send({ method: 'ui/notifications/initialized' });
  setHost(result.hostContext);
  ready = true;
  render();
  new ResizeObserver(() => send({ method: 'ui/notifications/size-changed', params: {
    height: Math.ceil(document.querySelector('main').getBoundingClientRect().height),
  } })).observe(document.querySelector('main'));
  await poll();
}
setLanguage(navigator.language);
void start().catch(showError);
</script>
</body>
